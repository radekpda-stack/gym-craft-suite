  <body>
    <script>
      // Apply theme immediately before React loads to prevent flash
      (function() {
        var THEME_KEY = 'app-theme';
        var DEFAULT_DARK = 'arctic-pro';
        var DEFAULT_LIGHT = 'frost-minimal';
        var VALID = ['nike', 'nike-volt', 'arctic-pro', 'light-minimal', 'frost-minimal'];
        var LIGHT_THEMES = ['light-minimal', 'frost-minimal'];
        
        try {
          var stored = localStorage.getItem(THEME_KEY);
          var theme;
          
          if (stored === 'system') {
            // Detect system preference
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? DEFAULT_DARK : DEFAULT_LIGHT;
          } else if (stored && VALID.indexOf(stored) !== -1) {
            theme = stored;
          } else {
            theme = DEFAULT_DARK;
          }
          
          document.documentElement.classList.add('theme-' + theme);
          
          if (LIGHT_THEMES.indexOf(theme) !== -1) {
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('theme-' + DEFAULT_DARK, 'dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
